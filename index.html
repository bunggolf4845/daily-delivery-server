<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ส่งของรายวัน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--card:#fff;--ink:#16231e;--mute:#5d6e67;--line:#cfd9d4;--brand:#1f7a5c;--brand-ink:#fff;--err:#b3261e;--ok:#1f7a5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1714;--card:#17221e;--ink:#e8f1ed;--mute:#93a69d;--line:#2b3b35;--brand:#3fb88f;--brand-ink:#06241a;--err:#ff8a80;--ok:#3fb88f}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Prompt",system-ui,sans-serif;min-height:100%;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
main{max-width:460px;margin:0 auto}
h1{font-size:1.6rem;margin:8px 0 4px}
p.sub{margin:0 0 20px;color:var(--mute);font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
.field{margin-bottom:16px}
input[type=text]{width:100%;padding:12px;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px}
select,input[type=number]{width:100%;padding:12px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
select:focus,input[type=number]:focus{outline:2px solid var(--brand);outline-offset:1px}
input[type=text]:focus,.drop:focus-within{outline:2px solid var(--brand);outline-offset:1px}
.drop{display:flex;align-items:center;justify-content:center;min-height:140px;border:2px dashed var(--line);border-radius:10px;cursor:pointer;overflow:hidden;text-align:center;color:var(--mute);padding:8px}
.drop img{max-width:100%;max-height:280px;border-radius:8px;display:none}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
button{width:100%;padding:14px;font:inherit;font-weight:700;color:var(--brand-ink);background:var(--brand);border:0;border-radius:10px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#msg{margin-top:14px;min-height:1.4em;font-size:.95rem}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <h1>ส่งของรายวัน</h1>
  <p class="sub">กรอกชื่อและแนบรูปหลักฐาน ระบบจะส่งเข้า Discord ให้ทันที</p>
  <div class="card">
    <div class="field">
      <label for="dc">ชื่อใน Discord</label>
      <input type="text" id="dc" autocomplete="off" placeholder="เช่น somchai#1234">
    </div>
    <div class="field">
      <label for="ign">ชื่อในเกม</label>
      <input type="text" id="ign" autocomplete="off" placeholder="ชื่อตัวละคร">
    </div>
    <div class="field">
      <label for="type">ประเภทของ</label>
      <select id="type"></select>
    </div>
    <div class="field">
      <label for="qty">จำนวนชิ้น</label>
      <input type="number" id="qty" min="1" max="99999" step="1" inputmode="numeric" placeholder="เช่น 20">
    </div>
    <div class="field">
      <label for="pic">รูปของที่ส่ง</label>
      <label class="drop" id="drop" for="pic">
        <span id="hint">แตะเพื่อเลือกรูป</span>
        <img id="prev" alt="ตัวอย่างรูปที่เลือก">
        <input type="file" id="pic" accept="image/*">
      </label>
    </div>
    <button id="send" type="button">ส่งเข้า Discord</button>
    <div id="msg" role="status"></div>
  </div>
</main>
<script>
// ===== ตั้งค่า: ใส่ Discord Webhook URL ของคุณตรงนี้ =====
const WEBHOOK_URL = "https://discord.com/api/webhooks/1564871852503998505/sunbaweJ6VZ-U62noJ9-Uv6FVgJ1MCOQIp6sRwlP43wtIxpNP9yuz9zfop5hXva9Xdx9";
// รายการประเภทของ แก้ไข/เพิ่ม/ลบได้ตามเกมของคุณ
const ITEM_TYPES = ["วัตถุดิบ", "แร่", "ยา/ไอเทมฟื้นฟู", "อาวุธ/อุปกรณ์", "เงิน/เหรียญ", "อื่นๆ"];
// =======================================================

const $ = id => document.getElementById(id);
ITEM_TYPES.forEach(t => { const o = document.createElement("option"); o.value = o.textContent = t; $("type").appendChild(o); });

// กันส่งซ้ำ: 1 ชื่อในเกม ส่งได้ 1 ครั้งต่อวัน (จำไว้ในเบราว์เซอร์)
const todayKey = ign => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "delivered:" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ":" + ign.toLowerCase();
};
const alreadySent = k => { try { return !!localStorage.getItem(k); } catch (e) { return false; } };
const markSent = k => { try { localStorage.setItem(k, "1"); } catch (e) {} };
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = c || ""; };

$("pic").addEventListener("change", () => {
  const f = $("pic").files[0];
  if (!f) return;
  const p = $("prev");
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
  $("hint").style.display = "none";
});

$("send").addEventListener("click", async () => {
  const dc = $("dc").value.trim(), ign = $("ign").value.trim(), f = $("pic").files[0];
  if (!dc || !ign) return msg("กรุณากรอกชื่อ Discord และชื่อในเกม", "err");
  const type = $("type").value, qty = parseInt($("qty").value, 10);
  if (!qty || qty < 1) return msg("กรุณากรอกจำนวนชิ้น (อย่างน้อย 1)", "err");
  const key = todayKey(ign);
  if (alreadySent(key)) return msg("วันนี้ส่งของในชื่อ “" + ign + "” ไปแล้ว พรุ่งนี้ส่งได้ใหม่", "err");
  if (!f) return msg("กรุณาแนบรูป", "err");
  if (f.size > 8 * 1024 * 1024) return msg("รูปใหญ่เกิน 8 MB กรุณาเลือกรูปที่เล็กกว่านี้", "err");
  if (WEBHOOK_URL.startsWith("PASTE_")) return msg("ยังไม่ได้ตั้งค่า Webhook URL ในไฟล์", "err");

  const date = new Date().toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
  const payload = {
    username: "ส่งของรายวัน",
    allowed_mentions: { parse: [] },
    embeds: [{
      title: "📦 ส่งของรายวัน",
      color: 0x1f7a5c,
      fields: [
        { name: "ชื่อ Discord", value: dc, inline: true },
        { name: "ชื่อในเกม", value: ign, inline: true },
        { name: "ประเภทของ", value: type, inline: true },
        { name: "จำนวน", value: qty.toLocaleString("th-TH") + " ชิ้น", inline: true },
        { name: "เวลา", value: date }
      ],
      image: { url: "attachment://" + (f.name.replace(/[^\w.\-]/g, "_") || "photo.png") }
    }]
  };
  const safeName = f.name.replace(/[^\w.\-]/g, "_") || "photo.png";
  const fd = new FormData();
  fd.append("payload_json", JSON.stringify(payload));
  fd.append("files[0]", f, safeName);

  $("send").disabled = true;
  msg("กำลังส่ง...");
  try {
    const r = await fetch(WEBHOOK_URL, { method: "POST", body: fd });
    if (r.status === 429) throw new Error("Discord จำกัดการส่งชั่วคราว กรุณารอสักครู่แล้วลองใหม่");
    if (!r.ok) throw new Error("ผิดพลาด " + r.status);
    markSent(key);
    msg("ส่งเรียบร้อยแล้ว ✅", "ok");
    $("dc").value = $("ign").value = $("qty").value = ""; $("pic").value = "";
    $("prev").style.display = "none"; $("hint").style.display = "";
  } catch (e) {
    msg(/^ผิดพลาด|^Discord/.test(e.message) ? e.message : "ส่งไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", "err");
  } finally {
    $("send").disabled = false;
  }
});
</script>
</body>
</html>

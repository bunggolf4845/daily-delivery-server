<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>แอดมิน · ส่งของรายวัน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card1:#171512;--card2:#0e0d0c;--line:#3d3322;--gold:#f2b42b;--hi:#ffd978;--lo:#b9780a;--txt:#eceff1;--mute:#a7a59d;--bad:#ff8a7a;--ok:#8fe3a8;color-scheme:dark}
*{box-sizing:border-box}
html{background:radial-gradient(ellipse at 50% -10%,#2b2110 0,#0b0a09 45%,#050505 100%) #050505 no-repeat;min-height:100%}
html,body{margin:0}
body{color:var(--txt);font-family:"Prompt",system-ui,"Noto Sans Thai",sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto}
h1{text-align:center;font-size:1.35rem;margin:4px 0 18px;font-family:"Kanit","Prompt",sans-serif;font-style:italic;font-weight:800;background:linear-gradient(180deg,#fff 0%,#c9ced2 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1rem;margin:0 0 12px;color:var(--hi);font-family:"Kanit","Prompt",sans-serif;font-style:italic;font-weight:800;letter-spacing:.2px}
#msg{min-height:1.4em;font-size:.92rem;margin:0 0 14px;text-align:center;font-weight:600}
.ok{color:var(--ok)}.err{color:var(--bad)}
.card{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 0 0 1px rgba(242,180,43,.08),0 10px 32px rgba(0,0,0,.6),0 0 24px rgba(242,180,43,.06)}
label{display:block;font-weight:600;font-size:.85rem;margin:0 0 6px;color:var(--hi)}
input,select{width:100%;padding:12px;margin:0 0 10px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:var(--txt);font:inherit;font-size:1rem}
input::placeholder{color:#6f6a5e}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
select option{background:#0a0a0a}
button{width:100%;padding:13px 14px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--hi),var(--gold) 55%,var(--lo));color:#1b1205;font-weight:700;font-size:.97rem;cursor:pointer;box-shadow:0 0 16px rgba(242,180,43,.3)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.sec{background:#0a0a0a;color:var(--hi);border:1px solid var(--line);box-shadow:none}
button.edt{width:auto;background:#0a0a0a;color:var(--hi);border:1px solid var(--line);padding:7px 12px;font-size:.78rem;box-shadow:none}
button.del{width:auto;background:#1c0f0e;color:var(--bad);border:1px solid #4a2320;padding:7px 12px;font-size:.78rem;box-shadow:none}
.btns{display:flex;gap:6px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.row>button{flex:1}
#editBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #251f14;font-size:.9rem}
li:first-child{border-top:0}
.ic{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:#0a0a0a;border:1px solid var(--line);font-size:1.05rem}
.mid{flex:1;min-width:0}
.mid b{color:var(--txt)}
.qty{color:var(--hi)}
li small{display:block;color:var(--mute);font-size:.74rem;margin-top:2px}
.empty{text-align:center;color:var(--mute);padding:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.stat{background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.15rem;color:var(--hi)}
.stat span{font-size:.74rem;color:var(--mute)}
.cnt{font-size:.78rem;color:var(--mute);margin:0 0 6px}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <h1>🛠️ แอดมิน · ส่งของรายวัน</h1>
  <p id="msg"></p>

  <section class="card" id="login">
    <h2>🔑 เข้าสู่ระบบ</h2>
    <input id="pass" type="password" placeholder="รหัสแอดมิน" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="go">เข้าสู่ระบบ</button>
  </section>

  <div id="panel" hidden>
    <section class="card">
      <h2>📊 สรุปยอดรวม</h2>
      <select id="sumMonth"><option value="0">เดือนนี้</option><option value="-1">เดือนที่แล้ว</option></select>
      <div id="sumBox"><p class="empty">กำลังโหลด…</p></div>
    </section>

    <section class="card">
      <h2>🔀 รวมชื่อที่พิมพ์ผิด</h2>
      <input id="from" type="text" placeholder="ชื่อที่ผิด (เช่น Rockman 49)" autocomplete="off">
      <input id="to" type="text" placeholder="ชื่อที่ถูก (เช่น RM Rockman)" autocomplete="off">
      <button id="ren">รวมชื่อ</button>
    </section>

    <section class="card">
      <h2>📣 ประกาศสรุปเดือนที่แล้วอีกครั้ง</h2>
      <button class="sec" id="sum">โพสต์สรุปเข้า Discord</button>
    </section>

    <section class="card">
      <h2>📋 รายการล่าสุด</h2>
      <input id="q" type="search" placeholder="ค้นหา ชื่อ / Discord / หมวด / วันที่ / #เลข" autocomplete="off">
      <p class="cnt" id="cnt"></p>
      <ul id="list"></ul>
    </section>
  </div>
</main>
<div id="editBox" hidden>
  <div class="card" style="width:100%;max-width:420px;margin:0">
    <h2 id="editTitle">✏️ แก้ไขรายการ</h2>
    <label for="editType">หมวดหมู่ (ประเภทของ)</label>
    <select id="editType"></select>
    <label for="editQty">จำนวนชิ้น</label>
    <input id="editQty" type="number" min="1" max="99999" step="1" inputmode="numeric">
    <div class="row"><button id="editSave">บันทึก</button><button class="sec" id="editCancel">ยกเลิก</button></div>
  </div>
</div>
<script>
const CFG = window.APP_CONFIG || {};
const URL_ = (CFG.supabaseUrl || "").replace(/\/+$/, ""), KEY = CFG.supabaseKey || "";
const $ = id => document.getElementById(id);
let PASS = "";
const say = (t, c) => { $("msg").textContent = t || ""; $("msg").className = c || ""; };
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function rpc(name, args) {
  const h = { "Content-Type": "application/json", apikey: KEY };
  if (!KEY.startsWith("sb_")) h.Authorization = "Bearer " + KEY;
  const r = await fetch(URL_ + "/rest/v1/rpc/" + name, { method: "POST", headers: h, body: JSON.stringify(args || {}) });
  if (!r.ok) throw new Error("db " + r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const pick = (r, ks) => { for (const k of ks) if (r[k] != null && r[k] !== "") return r[k]; return ""; };
const TYPE_ICON = t => /แร่/.test(t) ? "⛏️" : /กำมะถัน|ซัลเฟอร์/.test(t) ? "🟡" : "📦";
let ROWS = [];
const rowHtml = r => "<li><span class='ic'>" + TYPE_ICON(pick(r, ["item_type", "type"])) + "</span><span class='mid'><b>" + esc(r.ign) + "</b> · " + esc(pick(r, ["item_type", "type"])) + " · <b class='qty'>" + Number(pick(r, ["qty", "quantity", "amount"]) || 0).toLocaleString("en-US") + " ชิ้น</b><small>#" + r.id + " · " + esc(r.day) + " · Discord: " + esc(r.dc) + "</small></span><span class='btns'><button class='edt' data-id='" + r.id + "' data-q='" + Number(pick(r, ["qty", "quantity", "amount"]) || 0) + "' data-t='" + esc(pick(r, ["item_type", "type"])).replace(/'/g, "&#39;") + "'>แก้</button><button class='del' data-id='" + r.id + "'>ลบ</button></span></li>";
function render() {
  const q = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const hit = q ? ROWS.filter(r => [r.id, r.ign, r.dc, r.day, pick(r, ["item_type", "type"])].join(" ").toLowerCase().includes(q)) : ROWS.slice(0, 50);
  $("cnt").textContent = q ? "พบ " + hit.length + " จากล่าสุด " + ROWS.length + " รายการ" : "แสดงล่าสุด " + hit.length + " รายการ (พิมพ์ค้นหาเพื่อดูย้อนหลังได้ถึง " + ROWS.length + ")";
  $("list").innerHTML = hit.map(rowHtml).join("") || "<li class='empty'>" + (q ? "ไม่พบรายการที่ค้นหา" : "ยังไม่มีรายการ") + "</li>";
}
async function load() {
  ROWS = (await rpc("admin_list", { p_pass: PASS, p_limit: 500 })) || [];
  render();
}
$("q").addEventListener("input", render);
const fmt = n => Number(n || 0).toLocaleString("en-US");
function monthKey(off) {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit" }).formatToParts(new Date());
  const d = new Date(Date.UTC(+p.find(x => x.type === "year").value, +p.find(x => x.type === "month").value - 1 + off, 1));
  return { key: d.toISOString().slice(0, 7), label: d.toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" }) };
}
async function loadSummary() {
  const box = $("sumBox"), m = monthKey(Number($("sumMonth").value));
  try {
    const [a, b] = await Promise.all([rpc("leaderboard", { p_month: m.key }), rpc("leaderboard_types", { p_month: m.key })]);
    const rows = (a || []).map(r => ({ ign: r.ign, total: Number(r.total) || 0, days: r.days })).sort((x, y) => y.total - x.total);
    if (!rows.length) { box.innerHTML = "<p class='empty'>" + esc(m.label) + " ยังไม่มีข้อมูล</p>"; return; }
    const sum = rows.reduce((t, r) => t + r.total, 0), bt = {}, md = ["🥇", "🥈", "🥉"];
    (b || []).forEach(r => { const k = pick(r, ["type", "item_type"]); bt[k] = (bt[k] || 0) + (Number(r.total) || 0); });
    box.innerHTML = "<div class='stats'><div class='stat'><b>" + fmt(sum) + "</b><span>ชิ้นรวม · " + esc(m.label) + "</span></div><div class='stat'><b>" + rows.length + "</b><span>คนที่ส่ง</span></div></div><ul>"
      + Object.keys(bt).sort((x, y) => bt[y] - bt[x]).map(k => "<li><span class='ic'>" + TYPE_ICON(k) + "</span><span class='mid'><b>" + esc(k) + "</b></span><b class='qty'>" + fmt(bt[k]) + " ชิ้น</b></li>").join("")
      + rows.slice(0, 3).map((r, i) => "<li><span class='ic'>" + md[i] + "</span><span class='mid'><b>" + esc(r.ign) + "</b><small>ส่งมา " + esc(r.days) + " วัน</small></span><b class='qty'>" + fmt(r.total) + " ชิ้น</b></li>").join("") + "</ul>";
  } catch (e) { box.innerHTML = "<p class='empty err'>โหลดสรุปไม่สำเร็จ (" + esc(e.message) + ")</p>"; }
}
$("sumMonth").onchange = loadSummary;
async function enter(auto) {
  PASS = $("pass").value.trim(); if (!PASS) return;
  try { await load(); loadSummary(); sessionStorage.setItem("adm", PASS); $("login").hidden = true; $("panel").hidden = false; say(""); }
  catch (e) {
    sessionStorage.removeItem("adm"); if (auto) { $("pass").value = ""; return; }
    const m = String(e.message), c = m.replace("db ", "");
    say(c === "400" ? "รหัสไม่ถูกต้อง (รหัสไม่ตรงกับในฐานข้อมูล)"
      : c === "404" ? "ไม่พบฟังก์ชัน admin_list ใน Supabase (ยังไม่ได้รัน SQL ชุดแอดมิน)"
      : c === "401" || c === "403" ? "ถูกปฏิเสธสิทธิ์ (" + c + ") ตรวจ supabaseKey ใน config.js และสิทธิ์ของฟังก์ชัน"
      : /^db /.test(m) ? "เกิดข้อผิดพลาดจากฐานข้อมูล (" + c + ")" : "เชื่อมต่อ Supabase ไม่ได้ ตรวจ supabaseUrl ใน config.js (" + m + ")", "err");
  }
}
$("go").onclick = enter;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("list").addEventListener("click", async e => {
  const eb = e.target.closest("button.edt");
  if (eb) {
    const types = (CFG.itemTypes && CFG.itemTypes.length ? CFG.itemTypes : ["แร่", "กำมะถัน"]).slice(), cur = eb.dataset.t || "";
    if (cur && !types.includes(cur)) types.push(cur);
    $("editType").innerHTML = types.map(t => "<option value=\"" + esc(t) + "\"" + (t === cur ? " selected" : "") + ">" + esc(t) + (t === cur && !(CFG.itemTypes || []).includes(t) ? " (หมวดเดิม)" : "") + "</option>").join("");
    $("editQty").value = eb.dataset.q; $("editTitle").textContent = "✏️ แก้ไขรายการ #" + eb.dataset.id;
    $("editBox").dataset.id = eb.dataset.id; $("editBox").hidden = false;
    return;
  }
  const b = e.target.closest("button.del"); if (!b) return;
  if (!confirm("ลบรายการ #" + b.dataset.id + " ?")) return;
  try { await rpc("admin_delete", { p_pass: PASS, p_id: Number(b.dataset.id) }); say("ลบแล้ว", "ok"); await load(); loadSummary(); } catch (e2) { say("ลบไม่สำเร็จ", "err"); }
});
$("editCancel").onclick = () => { $("editBox").hidden = true; };
$("editSave").onclick = async () => {
  const q = parseInt($("editQty").value, 10), t = $("editType").value;
  if (!(q >= 1 && q <= 99999)) return say("จำนวนต้องเป็นตัวเลข 1 ถึง 99,999", "err");
  try {
    await rpc("admin_update_row", { p_pass: PASS, p_id: Number($("editBox").dataset.id), p_type: t, p_qty: q });
    $("editBox").hidden = true; say("แก้ไขแล้ว", "ok"); await load(); loadSummary();
  } catch (e) {
    $("editBox").hidden = true;
    say(e.message === "db 409" ? "แก้ไม่ได้: คนนี้มีรายการหมวดนี้ในวันเดียวกันอยู่แล้ว" : e.message === "db 404" ? "ไม่พบฟังก์ชัน admin_update_row ใน Supabase (ยังไม่ได้รัน SQL)" : "แก้ไม่สำเร็จ (" + e.message + ")", "err");
  }
};
$("ren").onclick = async () => {
  const f = $("from").value.trim(), t = $("to").value.trim(); if (!f || !t) return say("กรอกให้ครบทั้งสองช่อง", "err");
  if (!confirm("รวมชื่อ “" + f + "” เป็น “" + t + "” ?")) return;
  try { const n = await rpc("admin_rename", { p_pass: PASS, p_from: f, p_to: t }); say("รวมชื่อแล้ว " + n + " รายการ", "ok"); $("from").value = $("to").value = ""; await load(); } catch (e) { say("รวมชื่อไม่สำเร็จ", "err"); }
};
$("sum").onclick = async () => {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit" }).formatToParts(new Date());
  let y = +p.find(x => x.type === "year").value, m = +p.find(x => x.type === "month").value - 1; if (m < 1) { m = 12; y--; }
  const key = y + "-" + String(m).padStart(2, "0"), label = new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" });
  try {
    const raw = await rpc("leaderboard", { p_month: key }), top = (raw || []).sort((a, b) => b.total - a.total).slice(0, 3), md = ["🥇", "🥈", "🥉"];
    if (!top.length) return say("เดือนที่แล้วไม่มีข้อมูล", "err");
    // ยิงเข้า Discord ผ่านฟังก์ชันในฐานข้อมูล (notify_discord) แทนการเก็บ Webhook URL ไว้ในหน้าเว็บ
    await rpc("notify_discord", { p_payload: { username: "ส่งของรายวัน", allowed_mentions: { parse: [] }, embeds: [{ title: "🏆 สรุปอันดับประจำเดือน " + label, color: 0xF2B42B, description: top.map((d, i) => md[i] + " **" + d.ign + "** — " + Number(d.total).toLocaleString("th-TH") + " ชิ้น (" + d.days + " วัน)").join("\n") + "\n\nขอบคุณทุกคนที่ส่งของ 💛" }] } });
    say("ส่งคำสั่งโพสต์แล้ว ลองเช็กในดิสคอร์ดอีกครั้ง", "ok");
  } catch (e) { say("โพสต์ไม่สำเร็จ", "err"); }
};
const saved = sessionStorage.getItem("adm"); if (saved) { $("pass").value = saved; enter(true); }
</script>
</body>
</html>

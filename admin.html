<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>แอดมิน · ส่งของรายวัน</title>
<style>
:root{--bg:#0b0a08;--card:#16130d;--line:#3a2f17;--gold:#f2b42b;--hi:#ffd978;--txt:#f4efe2;--mute:#9b9482;--bad:#e5534b;--ok:#3fb950}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Noto Sans Thai",sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
main{max-width:560px;margin:0 auto}
h1{font-size:1.3rem;color:var(--hi);margin:6px 0 14px}
h2{font-size:1rem;color:var(--hi);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
input{width:100%;padding:12px;margin:0 0 8px;border-radius:10px;border:1px solid var(--line);background:#080808;color:var(--txt);font-size:1rem}
button{padding:11px 14px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--hi),var(--gold));color:#1a1405;font-weight:700;font-size:.95rem}
button.sec{background:#221d10;color:var(--hi);border:1px solid var(--line)}
button.edt{background:#221d10;color:var(--hi);border:1px solid var(--line);padding:7px 10px;font-size:.8rem}
button.del{background:#2a1413;color:#ff8b84;border:1px solid #5a2623;padding:7px 10px;font-size:.8rem}
.btns{display:flex;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>button{flex:0 0 auto}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
li small{display:block;color:var(--mute);font-size:.75rem;margin-top:2px}
#msg{min-height:1.4em;font-size:.9rem;margin:0 0 10px}
.ok{color:var(--ok)}.err{color:var(--bad)}
[hidden]{display:none!important}
</style>
<script src="config.js"></script>
</head>
<body>
<main>
  <h1>🛠️ แอดมิน · ส่งของรายวัน</h1>
  <p id="msg"></p>

  <section class="card" id="login">
    <h2>เข้าสู่ระบบ</h2>
    <input id="pass" type="password" placeholder="รหัสแอดมิน" autocomplete="current-password">
    <button id="go">เข้าสู่ระบบ</button>
  </section>

  <div id="panel" hidden>
    <section class="card">
      <h2>รวมชื่อที่พิมพ์ผิด</h2>
      <input id="from" type="text" placeholder="ชื่อที่ผิด (เช่น Cannaÿ2026)" autocomplete="off">
      <input id="to" type="text" placeholder="ชื่อที่ถูก (เช่น Cannanÿ2026)" autocomplete="off">
      <button id="ren">รวมชื่อ</button>
    </section>

    <section class="card">
      <h2>ประกาศสรุปเดือนที่แล้วอีกครั้ง</h2>
      <button class="sec" id="sum">โพสต์สรุปเข้า Discord</button>
    </section>

    <section class="card">
      <h2>รายการล่าสุด 50 รายการ</h2>
      <ul id="list"></ul>
    </section>
  </div>
</main>
<script>
const CFG = window.APP_CONFIG || {};
const URL_ = (CFG.supabaseUrl || "").replace(/\/+$/, ""), KEY = CFG.supabaseKey || "";
const $ = id => document.getElementById(id);
let PASS = "";
const say = (t, c) => { $("msg").textContent = t || ""; $("msg").className = c || ""; };
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function rpc(name, args) {
  const h = { "Content-Type": "application/json", apikey: KEY };
  if (!KEY.startsWith("sb_")) h.Authorization = "Bearer " + KEY;
  const r = await fetch(URL_ + "/rest/v1/rpc/" + name, { method: "POST", headers: h, body: JSON.stringify(args || {}) });
  if (!r.ok) throw new Error("db " + r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const pick = (r, ks) => { for (const k of ks) if (r[k] != null && r[k] !== "") return r[k]; return ""; };
async function load() {
  const rows = await rpc("admin_list", { p_pass: PASS, p_limit: 50 });
  $("list").innerHTML = (rows || []).map(r => "<li><span><b>" + esc(r.ign) + "</b> · " + esc(pick(r, ["item_type", "type"])) + " · " + Number(pick(r, ["qty", "quantity", "amount"]) || 0).toLocaleString("en-US") + " ชิ้น<small>#" + r.id + " · " + esc(r.day) + " · Discord: " + esc(r.dc) + "</small></span><span class='btns'><button class='edt' data-id='" + r.id + "' data-q='" + Number(pick(r, ["qty", "quantity", "amount"]) || 0) + "'>แก้</button><button class='del' data-id='" + r.id + "'>ลบ</button></span></li>").join("") || "<li>ยังไม่มีรายการ</li>";
}
async function enter() {
  PASS = $("pass").value; if (!PASS) return;
  try { await load(); sessionStorage.setItem("adm", PASS); $("login").hidden = true; $("panel").hidden = false; say(""); }
  catch (e) { say("รหัสผิด หรือยังไม่ได้ตั้งค่าฟังก์ชันแอดมินใน Supabase", "err"); }
}
$("go").onclick = enter;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("list").addEventListener("click", async e => {
  const eb = e.target.closest("button.edt");
  if (eb) {
    const v = prompt("จำนวนใหม่ของรายการ #" + eb.dataset.id + " (เดิม " + eb.dataset.q + " ชิ้น)", eb.dataset.q);
    if (v === null) return;
    const q = parseInt(v, 10); if (!(q >= 1 && q <= 99999)) return say("จำนวนต้องเป็นตัวเลข 1 ถึง 99,999", "err");
    try { await rpc("admin_set_qty", { p_pass: PASS, p_id: Number(eb.dataset.id), p_qty: q }); say("แก้จำนวนแล้ว", "ok"); await load(); } catch (e3) { say("แก้ไม่สำเร็จ (ยังไม่ได้รัน SQL ของฟังก์ชันแก้จำนวนหรือเปล่า)", "err"); }
    return;
  }
  const b = e.target.closest("button.del"); if (!b) return;
  if (!confirm("ลบรายการ #" + b.dataset.id + " ?")) return;
  try { await rpc("admin_delete", { p_pass: PASS, p_id: Number(b.dataset.id) }); say("ลบแล้ว", "ok"); await load(); } catch (e2) { say("ลบไม่สำเร็จ", "err"); }
});
$("ren").onclick = async () => {
  const f = $("from").value.trim(), t = $("to").value.trim(); if (!f || !t) return say("กรอกให้ครบทั้งสองช่อง", "err");
  if (!confirm("รวมชื่อ “" + f + "” เป็น “" + t + "” ?")) return;
  try { const n = await rpc("admin_rename", { p_pass: PASS, p_from: f, p_to: t }); say("รวมชื่อแล้ว " + n + " รายการ", "ok"); $("from").value = $("to").value = ""; await load(); } catch (e) { say("รวมชื่อไม่สำเร็จ", "err"); }
};
$("sum").onclick = async () => {
  const w = CFG.webhookUrl; if (!w) return say("ไม่พบ Webhook ใน config.js", "err");
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit" }).formatToParts(new Date());
  let y = +p.find(x => x.type === "year").value, m = +p.find(x => x.type === "month").value - 1; if (m < 1) { m = 12; y--; }
  const key = y + "-" + String(m).padStart(2, "0"), label = new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" });
  try {
    const raw = await rpc("leaderboard", { p_month: key }), top = (raw || []).sort((a, b) => b.total - a.total).slice(0, 3), md = ["🥇", "🥈", "🥉"];
    if (!top.length) return say("เดือนที่แล้วไม่มีข้อมูล", "err");
    const r = await fetch(w, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: "ส่งของรายวัน", allowed_mentions: { parse: [] }, embeds: [{ title: "🏆 สรุปอันดับประจำเดือน " + label, color: 0xF2B42B, description: top.map((d, i) => md[i] + " **" + d.ign + "** — " + Number(d.total).toLocaleString("th-TH") + " ชิ้น (" + d.days + " วัน)").join("\n") + "\n\nขอบคุณทุกคนที่ส่งของ 💛" }] }) });
    say(r.ok ? "โพสต์แล้ว" : "โพสต์ไม่สำเร็จ (" + r.status + ")", r.ok ? "ok" : "err");
  } catch (e) { say("โพสต์ไม่สำเร็จ", "err"); }
};
const saved = sessionStorage.getItem("adm"); if (saved) { $("pass").value = saved; enter(); }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>แอดมิน · ส่งของรายวัน</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&family=Kanit:ital,wght@1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card1:#171512;--card2:#0e0d0c;--line:#3d3322;--gold:#f2b42b;--hi:#ffd978;--lo:#b9780a;--txt:#eceff1;--mute:#a7a59d;--bad:#ff8a7a;--ok:#8fe3a8;color-scheme:dark}
*{box-sizing:border-box}
html{background:radial-gradient(ellipse at 50% -10%,#2b2110 0,#0b0a09 45%,#050505 100%) #050505 no-repeat;min-height:100%}
html,body{margin:0}
body{color:var(--txt);font-family:"Prompt",system-ui,"Noto Sans Thai",sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
main{max-width:480px;margin:0 auto}
h1{text-align:center;font-size:1.35rem;margin:4px 0 18px;font-family:"Kanit","Prompt",sans-serif;font-style:italic;font-weight:800;background:linear-gradient(180deg,#fff 0%,#c9ced2 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1rem;margin:0 0 12px;color:var(--hi);font-family:"Kanit","Prompt",sans-serif;font-style:italic;font-weight:800;letter-spacing:.2px}
#msg{min-height:1.4em;font-size:.92rem;margin:0 0 14px;text-align:center;font-weight:600}
.ok{color:var(--ok)}.err{color:var(--bad)}
.card{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 0 0 1px rgba(242,180,43,.08),0 10px 32px rgba(0,0,0,.6),0 0 24px rgba(242,180,43,.06)}
label{display:block;font-weight:600;font-size:.85rem;margin:0 0 6px;color:var(--hi)}
input,select{width:100%;padding:12px;margin:0 0 10px;border-radius:10px;border:1px solid var(--line);background:#0a0a0a;color:var(--txt);font:inherit;font-size:1rem}
input::placeholder{color:#6f6a5e}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px}
select option{background:#0a0a0a}
button{width:100%;padding:13px 14px;border:0;border-radius:10px;background:linear-gradient(180deg,var(--hi),var(--gold) 55%,var(--lo));color:#1b1205;font-weight:700;font-size:.97rem;cursor:pointer;box-shadow:0 0 16px rgba(242,180,43,.3)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
button.sec{background:#0a0a0a;color:var(--hi);border:1px solid var(--line);box-shadow:none}
button.edt{width:auto;background:#0a0a0a;color:var(--hi);border:1px solid var(--line);padding:7px 12px;font-size:.78rem;box-shadow:none}
button.del{width:auto;background:#1c0f0e;color:var(--bad);border:1px solid #4a2320;padding:7px 12px;font-size:.78rem;box-shadow:none}
.btns{display:flex;gap:6px;flex:none}
.row{display:flex;gap:8px;align-items:center}
.row>button{flex:1}
#editBox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #251f14;font-size:.9rem}
li:first-child{border-top:0}
.ic{flex:none;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:#0a0a0a;border:1px solid var(--line);font-size:1.05rem}
.mid{flex:1;min-width:0}
.mid b{color:var(--txt)}
.qty{color:var(--hi)}
li small{display:block;color:var(--mute);font-size:.74rem;margin-top:2px}
.empty{text-align:center;color:var(--mute);padding:10px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.stat{background:#0a0a0a;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.15rem;color:var(--hi)}
.stat span{font-size:.74rem;color:var(--mute)}
.cnt{font-size:.78rem;color:var(--mute);margin:0 0 6px}
[hidden]{display:none!important}
.pbadge{display:inline-block;min-width:22px;padding:0 7px;margin-left:8px;border-radius:999px;background:var(--bad);color:#1b0b07;font-family:"Prompt",sans-serif;font-style:normal;font-size:.78rem;font-weight:700;line-height:22px;text-align:center;vertical-align:middle}
.pc{padding:14px;border:1px solid #2a2316;border-left:3px solid var(--gold);border-radius:12px;background:#0d0c0a;margin-bottom:12px}
.pc.warn{border-left-color:var(--bad)}
.pc .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pc .ph strong{color:var(--hi);font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .ph small{color:var(--mute);font-size:.74rem;flex:none}
.pc .pi{margin:8px 0 0;display:flex;flex-direction:column;gap:2px;font-size:.9rem}
.pc .pi b{color:var(--hi)}
.pc .pl{margin:4px 0 0;font-size:.82rem;color:var(--mute)}
.pc .pn{margin:8px 0 0;font-size:.84rem;color:var(--bad)}
.pth{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.pth a{position:relative;display:block;aspect-ratio:1;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#0a0a0a}
.pth a.lp{border-color:var(--gold)}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth a.lp::after{content:"📍";position:absolute;left:3px;bottom:2px;font-size:.8rem}
.pact{display:flex;gap:8px;margin-top:12px}
.pact button{flex:1;width:auto}
.pact button.no{flex:0 0 36%;background:#1c0f0e;color:var(--bad);border:1px solid #4a2320;box-shadow:none}
.prej{display:flex;gap:8px;margin-top:10px}
.prej input{flex:1;min-width:0;margin:0}
.prej button{flex:0 0 auto;width:auto;background:#1c0f0e;color:var(--bad);border:1px solid #4a2320;box-shadow:none}
.pmsg{min-height:1.3em;margin:6px 0 0;font-size:.9rem;font-weight:600}
.pmsg.ok{color:var(--ok)}.pmsg.err{color:var(--bad)}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
.pc.late{border-left-color:var(--bad);background:#1a0e0c}
.pc .lt{margin:8px 0 0;font-size:.84rem;color:var(--bad);font-weight:600}
.pc .ei{display:flex;gap:6px;margin:6px 0 0}
.pc .ei select{flex:1;min-width:0;margin:0;padding:9px}
.pc .ei input{flex:0 0 96px;margin:0;padding:9px}
.pc .ebtn{display:flex;gap:8px;margin-top:10px}
.pc .ebtn button{flex:1;width:auto}
button.mini{width:auto;padding:6px 11px;font-size:.76rem;background:#0a0a0a;color:var(--hi);border:1px solid var(--line);box-shadow:none}
.pc.rej{border-left-color:#6b4a46}.pc.apv{border-left-color:var(--ok)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.72rem;font-weight:700;margin-right:6px}
.tag.a{background:#12301d;color:var(--ok)}.tag.r{background:#3a1814;color:var(--bad)}
#panel .card[data-tab]{display:none}
#panel[data-t="pend"] .card[data-tab="pend"],#panel[data-t="sum"] .card[data-tab="sum"],#panel[data-t="tools"] .card[data-tab="tools"],#panel[data-t="list"] .card[data-tab="list"],#panel[data-t="hist"] .card[data-tab="hist"]{display:block}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;padding:10px max(6px,calc((100% - 480px)/2)) max(14px,env(safe-area-inset-bottom,0px));background:#15130f;border-top:1px solid var(--line)}
#tabs button{flex:1;width:auto;min-width:0;padding:0;border:0;border-radius:0;background:none;box-shadow:none;color:var(--mute);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent;transform:none}
#tabs .pill{position:relative;display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px;transition:background .25s}
#tabs svg{width:24px;height:24px}
#tabs button.on{color:var(--hi)}
#tabs button.on .pill{background:rgba(242,180,43,.24)}
#tabs button:focus-visible .pill{outline:2px solid var(--gold)}
#tabs .tbd{position:absolute;top:-5px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#1b0b07;font-style:normal;font-size:.7rem;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px #15130f}
</style>
<script>document.write('<script src="config.js?t='+Date.now()+'"><\/script>')</script>
</head>
<body>
<main>
  <h1>🛠️ แอดมิน · ส่งของรายวัน</h1>
  <p id="msg"></p>

  <section class="card" id="login">
    <h2>🔑 เข้าสู่ระบบ</h2>
    <input id="pass" type="password" placeholder="รหัสแอดมิน" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button id="go">เข้าสู่ระบบ</button>
  </section>

  <div id="panel" data-t="pend" hidden>
    <section class="card" id="pendCard" data-tab="pend">
      <h2>📥 รออนุมัติ<span class="pbadge" id="pendBadge" hidden>0</span></h2>
      <p class="cnt" id="pendSum"></p>
      <div id="pendList"></div>
      <p class="pmsg" id="pendMsg" role="status"></p>
      <button class="sec" id="pendRef" type="button">🔄 รีเฟรชรายการ</button>
    </section>
    <section class="card" data-tab="hist">
      <h2>🕘 ประวัติอนุมัติ/ปฏิเสธ</h2>
      <select id="histF"><option value="">ทั้งหมด</option><option value="approved">เฉพาะอนุมัติ</option><option value="rejected">เฉพาะปฏิเสธ</option></select>
      <p class="cnt" id="histCnt"></p>
      <div id="histList"></div>
      <p class="pmsg" id="histMsg" role="status"></p>
      <button class="sec" id="histRef" type="button">🔄 รีเฟรชประวัติ</button>
    </section>
    <section class="card" data-tab="sum">
      <h2>📊 สรุปยอดรวม</h2>
      <select id="sumMonth"><option value="0">เดือนนี้</option><option value="-1">เดือนที่แล้ว</option></select>
      <div id="sumBox"><p class="empty">กำลังโหลด…</p></div>
    </section>

    <section class="card" data-tab="tools">
      <h2>🔀 รวมชื่อที่พิมพ์ผิด</h2>
      <input id="from" type="text" placeholder="ชื่อที่ผิด (เช่น Rockman 49)" autocomplete="off">
      <input id="to" type="text" placeholder="ชื่อที่ถูก (เช่น RM Rockman)" autocomplete="off">
      <button id="ren">รวมชื่อ</button>
    </section>

    <section class="card" data-tab="tools">
      <h2>📣 ประกาศสรุปเดือนที่แล้วอีกครั้ง</h2>
      <button class="sec" id="sum">โพสต์สรุปเข้า Discord</button>
    </section>

    <section class="card" data-tab="list">
      <h2>📋 รายการล่าสุด</h2>
      <input id="q" type="search" placeholder="ค้นหา ชื่อ / Discord / หมวด / วันที่ / #เลข" autocomplete="off">
      <p class="cnt" id="cnt"></p>
      <ul id="list"></ul>
    </section>
  </div>
</main>
<nav id="tabs" aria-label="เมนูแอดมิน" hidden>
  <button type="button" data-t="pend" class="on" aria-current="page"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg><i class="tbd" id="tabBadge" hidden>0</i></span><span>รออนุมัติ</span></button>
  <button type="button" data-t="sum" aria-current="false"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></span><span>สรุป</span></button>
  <button type="button" data-t="tools" aria-current="false"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></span><span>จัดการ</span></button>
  <button type="button" data-t="hist" aria-current="false"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>ประวัติ</span></button>
  <button type="button" data-t="list" aria-current="false"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>รายการ</span></button>
</nav>
<div id="editBox" hidden>
  <div class="card" style="width:100%;max-width:420px;margin:0">
    <h2 id="editTitle">✏️ แก้ไขรายการ</h2>
    <label for="editType">หมวดหมู่ (ประเภทของ)</label>
    <select id="editType"></select>
    <label for="editQty">จำนวนชิ้น</label>
    <input id="editQty" type="number" min="1" max="99999" step="1" inputmode="numeric">
    <div class="row"><button id="editSave">บันทึก</button><button class="sec" id="editCancel">ยกเลิก</button></div>
  </div>
</div>
<script>
const CFG = window.APP_CONFIG || {};
const URL_ = (CFG.supabaseUrl || "").replace(/\/+$/, ""), KEY = CFG.supabaseKey || "";
const $ = id => document.getElementById(id);
let PASS = "";
const say = (t, c) => { $("msg").textContent = t || ""; $("msg").className = c || ""; };
const esc = t => String(t == null ? "" : t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function rpc(name, args) {
  const h = { "Content-Type": "application/json", apikey: KEY };
  if (!KEY.startsWith("sb_")) h.Authorization = "Bearer " + KEY;
  const r = await fetch(URL_ + "/rest/v1/rpc/" + name, { method: "POST", headers: h, body: JSON.stringify(args || {}) });
  if (!r.ok) throw new Error("db " + r.status);
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const pick = (r, ks) => { for (const k of ks) if (r[k] != null && r[k] !== "") return r[k]; return ""; };
const TYPE_ICON = t => /แร่/.test(t) ? "⛏️" : /กำมะถัน|ซัลเฟอร์/.test(t) ? "🟡" : "📦";
let ROWS = [];
const rowHtml = r => "<li><span class='ic'>" + TYPE_ICON(pick(r, ["item_type", "type"])) + "</span><span class='mid'><b>" + esc(r.ign) + "</b> · " + esc(pick(r, ["item_type", "type"])) + " · <b class='qty'>" + Number(pick(r, ["qty", "quantity", "amount"]) || 0).toLocaleString("en-US") + " ชิ้น</b><small>#" + r.id + " · " + esc(r.day) + " · Discord: " + esc(r.dc) + "</small></span><span class='btns'><button class='edt' data-id='" + r.id + "' data-q='" + Number(pick(r, ["qty", "quantity", "amount"]) || 0) + "' data-t='" + esc(pick(r, ["item_type", "type"])).replace(/'/g, "&#39;") + "'>แก้</button><button class='del' data-id='" + r.id + "'>ลบ</button></span></li>";
function render() {
  const q = $("q").value.trim().toLowerCase().replace(/^#/, "");
  const hit = q ? ROWS.filter(r => [r.id, r.ign, r.dc, r.day, pick(r, ["item_type", "type"])].join(" ").toLowerCase().includes(q)) : ROWS.slice(0, 50);
  $("cnt").textContent = q ? "พบ " + hit.length + " จากล่าสุด " + ROWS.length + " รายการ" : "แสดงล่าสุด " + hit.length + " รายการ (พิมพ์ค้นหาเพื่อดูย้อนหลังได้ถึง " + ROWS.length + ")";
  $("list").innerHTML = hit.map(rowHtml).join("") || "<li class='empty'>" + (q ? "ไม่พบรายการที่ค้นหา" : "ยังไม่มีรายการ") + "</li>";
}
async function load() {
  ROWS = (await rpc("admin_list", { p_pass: PASS, p_limit: 500 })) || [];
  render();
}
$("q").addEventListener("input", render);
const fmt = n => Number(n || 0).toLocaleString("en-US");
function monthKey(off) {
  const p = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit" }).formatToParts(new Date());
  const d = new Date(Date.UTC(+p.find(x => x.type === "year").value, +p.find(x => x.type === "month").value - 1 + off, 1));
  return { key: d.toISOString().slice(0, 7), label: d.toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" }) };
}
async function loadSummary() {
  const box = $("sumBox"), m = monthKey(Number($("sumMonth").value));
  try {
    const [a, b] = await Promise.all([rpc("leaderboard", { p_month: m.key }), rpc("leaderboard_types", { p_month: m.key })]);
    const rows = (a || []).map(r => ({ ign: r.ign, total: Number(r.total) || 0, days: r.days })).sort((x, y) => y.total - x.total);
    if (!rows.length) { box.innerHTML = "<p class='empty'>" + esc(m.label) + " ยังไม่มีข้อมูล</p>"; return; }
    const sum = rows.reduce((t, r) => t + r.total, 0), bt = {}, md = ["🥇", "🥈", "🥉"];
    (b || []).forEach(r => { const k = pick(r, ["type", "item_type"]); bt[k] = (bt[k] || 0) + (Number(r.total) || 0); });
    box.innerHTML = "<div class='stats'><div class='stat'><b>" + fmt(sum) + "</b><span>ชิ้นรวม · " + esc(m.label) + "</span></div><div class='stat'><b>" + rows.length + "</b><span>คนที่ส่ง</span></div></div><ul>"
      + Object.keys(bt).sort((x, y) => bt[y] - bt[x]).map(k => "<li><span class='ic'>" + TYPE_ICON(k) + "</span><span class='mid'><b>" + esc(k) + "</b></span><b class='qty'>" + fmt(bt[k]) + " ชิ้น</b></li>").join("")
      + rows.slice(0, 3).map((r, i) => "<li><span class='ic'>" + md[i] + "</span><span class='mid'><b>" + esc(r.ign) + "</b><small>ส่งมา " + esc(r.days) + " วัน</small></span><b class='qty'>" + fmt(r.total) + " ชิ้น</b></li>").join("") + "</ul>";
  } catch (e) { box.innerHTML = "<p class='empty err'>โหลดสรุปไม่สำเร็จ (" + esc(e.message) + ")</p>"; }
}
$("sumMonth").onchange = loadSummary;
async function enter(auto) {
  PASS = $("pass").value.trim(); if (!PASS) return;
  try { await load(); loadSummary(); loadPending(); sessionStorage.setItem("adm", PASS); $("login").hidden = true; $("panel").hidden = false; $("tabs").hidden = false; say(""); }
  catch (e) {
    sessionStorage.removeItem("adm"); if (auto) { $("pass").value = ""; return; }
    const m = String(e.message), c = m.replace("db ", "");
    say(c === "400" ? "รหัสไม่ถูกต้อง (รหัสไม่ตรงกับในฐานข้อมูล)"
      : c === "404" ? "ไม่พบฟังก์ชัน admin_list ใน Supabase (ยังไม่ได้รัน SQL ชุดแอดมิน)"
      : c === "401" || c === "403" ? "ถูกปฏิเสธสิทธิ์ (" + c + ") ตรวจ supabaseKey ใน config.js และสิทธิ์ของฟังก์ชัน"
      : /^db /.test(m) ? "เกิดข้อผิดพลาดจากฐานข้อมูล (" + c + ")" : "เชื่อมต่อ Supabase ไม่ได้ ตรวจ supabaseUrl ใน config.js (" + m + ")", "err");
  }
}
$("go").onclick = enter;
$("pass").addEventListener("keydown", e => { if (e.key === "Enter") enter(); });
$("list").addEventListener("click", async e => {
  const eb = e.target.closest("button.edt");
  if (eb) {
    const types = (CFG.itemTypes && CFG.itemTypes.length ? CFG.itemTypes : ["แร่", "กำมะถัน"]).slice(), cur = eb.dataset.t || "";
    if (cur && !types.includes(cur)) types.push(cur);
    $("editType").innerHTML = types.map(t => "<option value=\"" + esc(t) + "\"" + (t === cur ? " selected" : "") + ">" + esc(t) + (t === cur && !(CFG.itemTypes || []).includes(t) ? " (หมวดเดิม)" : "") + "</option>").join("");

    await pcall("admin_mark_posted", { p_id: r.id });
    announceTop(before, r.ign);
    pm("อนุมัติ " + r.ign + " แล้ว ✅ นับยอดและลง Discord เรียบร้อย", "ok");
  } catch (e) {
    pm(approved ? "อนุมัติและนับยอดแล้ว แต่ส่งเข้า Discord ไม่สำเร็จ — กด “ส่งเข้า Discord อีกครั้ง” ที่รายการ" : (e.user ? e.message : "อนุมัติไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองใหม่"), "err");
  }
  EDITING = false; plock(false); await loadPending(true); load().catch(() => {}); loadSummary();
}
async function rejectPend(r, why) {
  if (pbusy) return; plock(true); pm("กำลังบันทึก...");
  try { await pcall("admin_reject", { p_id: r.id, p_reason: why }); pm("ปฏิเสธ " + r.ign + " แล้ว", "ok"); }
  catch (e) { pm(e.user ? e.message : "บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง", "err"); }
  EDITING = false; plock(false); await loadPending(true);
}
$("pendRef").onclick = () => { EDITING = false; loadPending(); };
setInterval(() => { if (PASS && !$("panel").hidden && !document.hidden && !pbusy) loadPending(true); }, 30000);
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  $("panel").dataset.t = b.dataset.t;
  $("tabs").querySelectorAll("button").forEach(x => { const on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-current", on ? "page" : "false"); });
  if (b.dataset.t === "hist") loadHistory();
  scrollTo({ top: 0 });
});
const saved = sessionStorage.getItem("adm"); if (saved) { $("pass").value = saved; enter(true); }
</script>

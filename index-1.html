<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ส่งของรายวัน | Rockman</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#121110;--ink:#eceff1;--mute:#a7a59d;--line:#3d3322;--gold:#f2b42b;--gold-hi:#ffd978;--gold-lo:#b9780a;--err:#ff8a7a;--ok:#8fe3a8;color-scheme:dark}
*{box-sizing:border-box}
html{background:#050505}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#2b2110 0,#0b0a09 45%,#050505 100%) no-repeat;color:var(--ink);font-family:"Prompt",system-ui,sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
main{max-width:460px;margin:0 auto}
.logo{display:block;width:min(230px,66%);margin:0 auto 4px;mix-blend-mode:lighten}
h1{text-align:center;font-size:1.65rem;margin:4px 0;background:linear-gradient(180deg,#fff 0%,#c9ced2 45%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{text-align:center;margin:0 0 20px;color:var(--mute);font-size:.95rem}
.card{background:linear-gradient(180deg,#171512,#0e0d0c);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 0 0 1px rgba(242,180,43,.08),0 12px 40px rgba(0,0,0,.65),0 0 34px rgba(242,180,43,.08)}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px;color:var(--gold-hi)}
.field{margin-bottom:16px}
input[type=text],select,input[type=number]{width:100%;padding:12px;font:inherit;color:var(--ink);background:#0a0a0a;border:1px solid var(--line);border-radius:10px}
input::placeholder{color:#6f6a5e}
select option{background:#0a0a0a;color:var(--ink)}
input[type=text]:focus,input[type=number]:focus,select:focus,.drop:focus-within{outline:2px solid var(--gold);outline-offset:1px}
.drop{display:flex;align-items:center;justify-content:center;min-height:140px;border:2px dashed #5d4b27;border-radius:10px;cursor:pointer;overflow:hidden;text-align:center;color:var(--mute);padding:8px;background:#0a0a0a}
.drop img{max-width:100%;max-height:280px;border-radius:8px;display:none}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
button{width:100%;padding:14px;font:inherit;font-weight:700;font-size:1.02rem;color:#1b1205;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));border:0;border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(242,180,43,.35)}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#msg{margin-top:14px;min-height:1.4em;font-size:.95rem}
#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.board{margin-top:20px}
.board h2{margin:0 0 12px;font-size:1.2rem;text-align:center;background:linear-gradient(180deg,#fff 0%,#c9ced2 40%,var(--gold) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;font-size:.92rem;color:var(--gold-hi);background:#0a0a0a;border:1px solid var(--line);box-shadow:none}
.tabs button[aria-pressed=true]{color:#1b1205;background:linear-gradient(180deg,var(--gold-hi),var(--gold) 50%,var(--gold-lo));border-color:transparent}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #251f14}
.rows li:last-child{border-bottom:0}
.rk{width:34px;text-align:center;font-weight:700;color:var(--mute);flex:none}
.rows li:nth-child(-n+3) .rk{font-size:1.3rem}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rows li:first-child .nm{color:var(--gold-hi);font-weight:700}
.tt{text-align:right;flex:none}
.tt b{display:block;color:var(--gold-hi)}
.tt small{color:var(--mute);font-size:.78rem}
.empty{text-align:center;color:var(--mute);padding:14px 0;margin:0}
</style>
</head>

  <h1>ส่งของรายวัน</h1>
  <p class="sub">กรอกชื่อและแนบรูปหลักฐาน ระบบจะส่งเข้า Discord ให้ทันที</p>
  <div class="card">
    <div class="field">
      <label for="dc">ชื่อใน Discord</label>
      <input type="text" id="dc" autocomplete="off" placeholder="เช่น somchai#1234">
    </div>
    <div class="field">
      <label for="ign">ชื่อในเกม</label>
      <input type="text" id="ign" autocomplete="off" placeholder="ชื่อตัวละคร">
    </div>
    <div class="field">
      <label for="type">ประเภทของ</label>
      <select id="type"></select>
    </div>
    <div class="field">
      <label for="qty">จำนวนชิ้น</label>
      <input type="number" id="qty" min="1" max="99999" step="1" inputmode="numeric" placeholder="เช่น 20">
    </div>
    <div class="field">
      <label for="pic">รูปของที่ส่ง</label>
      <label class="drop" id="drop" for="pic">
        <span id="hint">แตะเพื่อเลือกรูป</span>
        <img id="prev" alt="ตัวอย่างรูปที่เลือก">
        <input type="file" id="pic" accept="image/*">
      </label>
    </div>
    <button id="send" type="button">ส่งเข้า Discord</button>
    <div id="msg" role="status"></div>
  </div>
  <section class="card board" id="boardCard" hidden>
    <h2>🏆 อันดับส่งของประจำเดือน</h2>
    <div class="tabs">
      <button type="button" id="tabNow" aria-pressed="true">เดือนนี้</button>
      <button type="button" id="tabPrev" aria-pressed="false">เดือนที่แล้ว</button>
    </div>
    <p class="sub" id="boardMonth" style="margin:0 0 6px"></p>
    <ol class="rows" id="rows"></ol>
  </section>
</main>
<script>
// ===== ตั้งค่า: ใส่ Discord Webhook URL ของคุณตรงนี้ =====
const WEBHOOK_URL = "PASTE_YOUR_DISCORD_WEBHOOK_URL_HERE";
// ตั้งค่าอันดับ (ไม่บังคับ): ใส่ค่าจาก Supabase ถ้าอยากให้มีอันดับประจำเดือน ปล่อยไว้ถ้าไม่ใช้
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_KEY = "PASTE_YOUR_SUPABASE_KEY_HERE";
// รายการประเภทของ แก้ไข/เพิ่ม/ลบได้ตามเกมของคุณ
const ITEM_TYPES = ["วัตถุดิบ", "แร่", "ยา/ไอเทมฟื้นฟู", "อาวุธ/อุปกรณ์", "เงิน/เหรียญ", "อื่นๆ"];
// =======================================================

const $ = id => document.getElementById(id);
ITEM_TYPES.forEach(t => { const o = document.createElement("option"); o.value = o.textContent = t; $("type").appendChild(o); });

// กันส่งซ้ำ: 1 ชื่อในเกม ส่งได้ 1 ครั้งต่อวัน (จำไว้ในเบราว์เซอร์)
const todayKey = ign => {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "delivered:" + d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + ":" + ign.toLowerCase();
};
const alreadySent = k => { try { return !!localStorage.getItem(k); } catch (e) { return false; } };
const markSent = k => { try { localStorage.setItem(k, "1"); } catch (e) {} };
const msg = (t, c) => { $("msg").textContent = t; $("msg").className = c || ""; };

// ===== อันดับประจำเดือน (ใช้ Supabase เก็บข้อมูลกลาง) =====
const BOARD_ON = !SUPABASE_URL.startsWith("PASTE_") && !SUPABASE_KEY.startsWith("PASTE_");
const userErr = t => { const e = new Error(t); e.user = true; return e; };
async function rpc(name, args) {
  const h = { "Content-Type": "application/json", apikey: SUPABASE_KEY };
  if (!SUPABASE_KEY.startsWith("sb_")) h.Authorization = "Bearer " + SUPABASE_KEY;
  const r = await fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/" + name, { method: "POST", headers: h, body: JSON.stringify(args || {}) });
  if (!r.ok) throw new Error("db " + r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
const bkkMonth = offset => { // คืนค่า {key:"2026-10", label:"ตุลาคม 2569"} ตามเวลาไทย
  const parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Bangkok", year: "numeric", month: "2-digit" }).formatToParts(new Date());
  let y = +parts.find(p => p.type === "year").value, m = +parts.find(p => p.type === "month").value + offset;
  while (m < 1) { m += 12; y--; }
  const key = y + "-" + String(m).padStart(2, "0");
  return { key, label: new Date(Date.UTC(y, m - 1, 15)).toLocaleDateString("th-TH", { month: "long", year: "numeric", timeZone: "UTC" }) };
};
let boardOffset = 0;
async function loadBoard() {
  if (!BOARD_ON) return;
  $("boardCard").hidden = false;
  const mo = bkkMonth(boardOffset), rows = $("rows");
  $("boardMonth").textContent = mo.label;
  $("tabNow").setAttribute("aria-pressed", boardOffset === 0);
  $("tabPrev").setAttribute("aria-pressed", boardOffset === -1);
  rows.innerHTML = ""; 
  try {
    const data = await rpc("leaderboard", { p_month: mo.key });
    if (!data || !data.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "ยังไม่มีข้อมูลของเดือนนี้"; rows.appendChild(p); return; }
    data.forEach((d, i) => {
      const li = document.createElement("li");
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = ["🥇", "🥈", "🥉"][i] || (i + 1);
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = d.ign;
      const tt = document.createElement("span"); tt.className = "tt";
      const b = document.createElement("b"); b.textContent = Number(d.total).toLocaleString("th-TH") + " ชิ้น";
      const sm = document.createElement("small"); sm.textContent = d.days + " วัน";
      tt.append(b, sm); li.append(rk, nm, tt); rows.appendChild(li);
    });
  } catch (e) {
    const p = document.createElement("p"); p.className = "empty"; p.textContent = "โหลดอันดับไม่สำเร็จ ลองรีเฟรชหน้า"; rows.appendChild(p);
  }
}
$("tabNow").addEventListener("click", () => { boardOffset = 0; loadBoard(); });
$("tabPrev").addEventListener("click", () => { boardOffset = -1; loadBoard(); });
loadBoard();

$("pic").addEventListener("change", () => {
  const f = $("pic").files[0];
  if (!f) return;
  const p = $("prev");
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
  $("hint").style.display = "none";
});

$("send").addEventListener("click", async () => {
  const dc = $("dc").value.trim(), ign = $("ign").value.trim(), f = $("pic").files[0];
  if (!dc || !ign) return msg("กรุณากรอกชื่อ Discord และชื่อในเกม", "err");
  const type = $("type").value, qty = parseInt($("qty").value, 10);
  if (!qty || qty < 1) return msg("กรุณากรอกจำนวนชิ้น (อย่างน้อย 1)", "err");
  const key = todayKey(ign);
  if (!BOARD_ON && alreadySent(key)) return msg("วันนี้ส่งของในชื่อ “" + ign + "” ไปแล้ว พรุ่งนี้ส่งได้ใหม่", "err");
  if (!f) return msg("กรุณาแนบรูป", "err");
  if (f.size > 8 * 1024 * 1024) return msg("รูปใหญ่เกิน 8 MB กรุณาเลือกรูปที่เล็กกว่านี้", "err");
  if (WEBHOOK_URL.startsWith("PASTE_")) return msg("ยังไม่ได้ตั้งค่า Webhook URL ในไฟล์", "err");

  const date = new Date().toLocaleString("th-TH", { dateStyle: "medium", timeStyle: "short" });
  const payload = {
    username: "ส่งของรายวัน",
    allowed_mentions: { parse: [] },
    embeds: [{
      title: "📦 ส่งของรายวัน",
      color: 0x1f7a5c,
      fields: [
        { name: "ชื่อ Discord", value: dc, inline: true },
        { name: "ชื่อในเกม", value: ign, inline: true },
        { name: "ประเภทของ", value: type, inline: true },
        { name: "จำนวน", value: qty.toLocaleString("th-TH") + " ชิ้น", inline: true },
        { name: "เวลา", value: date }
      ],
      image: { url: "attachment://" + (f.name.replace(/[^\w.\-]/g, "_") || "photo.png") }
    }]
  };
  const safeName = f.name.replace(/[^\w.\-]/g, "_") || "photo.png";
  const fd = new FormData();
  fd.append("payload_json", JSON.stringify(payload));
  fd.append("files[0]", f, safeName);

  $("send").disabled = true;
  msg("กำลังส่ง...");
  let saved = true;
  try {
    if (BOARD_ON) {
      let sentToday = false;
      try { sentToday = await rpc("already_sent", { p_ign: ign }); } catch (e) { throw userErr("เชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง"); }
      if (sentToday) throw userErr("วันนี้ส่งของในชื่อ “" + ign + "” ไปแล้ว พรุ่งนี้ส่งได้ใหม่");
    }
    const r = await fetch(WEBHOOK_URL, { method: "POST", body: fd });
    if (r.status === 429) throw new Error("Discord จำกัดการส่งชั่วคราว กรุณารอสักครู่แล้วลองใหม่");
    if (!r.ok) throw new Error("ผิดพลาด " + r.status);
    markSent(key);
    if (BOARD_ON) {
      try { await rpc("add_delivery", { p_ign: ign, p_dc: dc, p_type: type, p_qty: qty }); }
      catch (e) { saved = false; }
    }
    msg(saved ? "ส่งเรียบร้อยแล้ว ✅" : "ส่งเข้า Discord แล้ว แต่บันทึกอันดับไม่สำเร็จ กรุณาแจ้งแอดมิน", saved ? "ok" : "err");
    if (BOARD_ON && saved) loadBoard();
    $("dc").value = $("ign").value = $("qty").value = ""; $("pic").value = "";
    $("prev").style.display = "none"; $("hint").style.display = "";
  } catch (e) {
    msg(e.user || /^ผิดพลาด|^Discord/.test(e.message) ? e.message : "ส่งไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่", "err");
  } finally {
    $("send").disabled = false;
  }
});
</script>
</body>
</html>
